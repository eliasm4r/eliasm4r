<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.t{fill:#8fb8ff;font-size:13px;font-weight:700;letter-spacing:2px}
.k{fill:#8b95a7;font-size:14px;letter-spacing:1px}
.v{fill:#e8edf5;font-size:15px;font-weight:600}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.on{animation:pop .15s ease-out both}
@keyframes pop{from{opacity:0}to{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect x="1" y="1" width="838" height="208" rx="14" fill="#0a0d14"/>
<rect x="14" y="16" width="812" height="180" rx="8" fill="#111622" stroke="#2a3345" stroke-width="2"/>


<text x="40" y="50" class="k" font-size="12">PLAYER 1</text>
<text x="800" y="50" class="k" font-size="12" text-anchor="end">HI-SCORE <tspan fill="#8fb8ff">2026</tspan></text>
<text x="420.0" y="112" text-anchor="middle" fill="#8fb8ff" font-size="64" font-weight="800" letter-spacing="10" filter="url(#glow)">ELIAS M</text>
<text x="420.0" y="146" text-anchor="middle" fill="#e8edf5" font-size="16" letter-spacing="5">FULL-STACK DEVELOPER</text>
<g class="blink"><polygon points="342.0,170 342.0,182 352.0,176" fill="#8fb8ff"/>
<text x="428.0" y="181" text-anchor="middle" fill="#8fb8ff" font-size="14" font-weight="700" letter-spacing="4">PRESS START</text></g>
<rect x="1" y="1" width="838" height="208" rx="14" fill="url(#scan)" pointer-events="none"/>
</svg>