<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.t{fill:#8fb8ff;font-size:13px;font-weight:700;letter-spacing:2px}
.k{fill:#8b95a7;font-size:14px;letter-spacing:1px}
.v{fill:#e8edf5;font-size:15px;font-weight:600}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.on{animation:pop .15s ease-out both}
@keyframes pop{from{opacity:0}to{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect x="1" y="1" width="838" height="148" rx="14" fill="#0a0d14"/>
<rect x="14" y="16" width="812" height="120" rx="8" fill="#111622" stroke="#2a3345" stroke-width="2"/>

<text x="420.0" y="70" text-anchor="middle" fill="#e8edf5" font-size="20" font-weight="700" letter-spacing="4">DO YOU WANT TO RECRUIT ELIAS ?</text>
<g class="blink"><polygon points="328.0,96 328.0,110 340.0,103" fill="#8fb8ff"/></g>
<text x="370.0" y="109" text-anchor="middle" fill="#8fb8ff" font-size="18" font-weight="800" letter-spacing="3" filter="url(#glow)">YES</text>
<text x="480.0" y="109" text-anchor="middle" fill="#8b95a7" font-size="18" letter-spacing="3">NO</text>
<rect x="1" y="1" width="838" height="148" rx="14" fill="url(#scan)" pointer-events="none"/>
</svg>